<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SYZOJ 提交监视器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>SYZOJ 提交监视器</h1>

  <label for="username">监测用户（每行一个，或用逗号/空格分隔）</label>
  <textarea id="username" rows="6" placeholder="输入目标用户名&#10;例如：&#10;alice&#10;bob, carol" autocomplete="off" spellcheck="false"></textarea>

  <div class="current">当前：<span id="current-user">未设置</span></div>

  <div class="actions">
    <button id="save" type="button">保存</button>
  </div>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
